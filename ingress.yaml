apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapp-ingress
  namespace: default
spec:
  rules:
  - host: fastapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fastapp-service
            port:
              number: 80